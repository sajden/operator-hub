services:
  hub:
    build:
      context: .
      dockerfile: hub/Dockerfile
    container_name: operator-hub-mini-hub
    env_file:
      - .env
    environment:
      OPERATOR_HUB_PORT: 8787
      OPERATOR_HUB_PUBLIC_URL: ${OPERATOR_HUB_PUBLIC_URL:-http://127.0.0.1:8787}
      OPERATOR_HUB_MS_TENANT_ID: ${OPERATOR_HUB_MS_TENANT_ID:-common}
      OPERATOR_HUB_MS_CLIENT_ID: ${OPERATOR_HUB_MS_CLIENT_ID:-}
      OPERATOR_HUB_MS_SCOPES: ${OPERATOR_HUB_MS_SCOPES:-openid profile offline_access User.Read Files.Read}
    ports:
      - "8787:8787"
    volumes:
      - ./projects:/workspace/projects
      - ./.local:/workspace/.local
    working_dir: /workspace/hub

  app:
    image: node:20-alpine
    container_name: operator-hub-app
    working_dir: /workspace/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      OPERATOR_HUB_URL: http://hub:8787
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - app_node_modules:/workspace/app/node_modules
    depends_on:
      - hub

volumes:
  app_node_modules:
